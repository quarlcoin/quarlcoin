description "Quarlcoin Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env QUARLD_BIN="/usr/bin/quarld"
env QUARLD_USER="quarlcoin"
env QUARLD_GROUP="quarlcoin"
env QUARLD_PIDDIR="/var/run/quarld"
# upstart can't handle variables constructed with other variables
env QUARLD_PIDFILE="/var/run/quarld/quarld.pid"
env QUARLD_CONFIGFILE="/etc/quarlcoin/quarlcoin.conf"
env QUARLD_DATADIR="/var/lib/quarld"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # quarld will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$QUARLD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run quarld."
        echo "The setting must appear in $QUARLD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Quarlcoin Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$QUARLD_PIDDIR"
    chmod 0755 "$QUARLD_PIDDIR"
    chown $QUARLD_USER:$QUARLD_GROUP "$QUARLD_PIDDIR"
    chown $QUARLD_USER:$QUARLD_GROUP "$QUARLD_CONFIGFILE"
    chmod 0660 "$QUARLD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$QUARLD_PIDFILE" \
    --chuid $QUARLD_USER:$QUARLD_GROUP \
    --exec "$QUARLD_BIN" \
    -- \
    -pid="$QUARLD_PIDFILE" \
    -conf="$QUARLD_CONFIGFILE" \
    -datadir="$QUARLD_DATADIR" \
    -disablewallet \
    -daemon

